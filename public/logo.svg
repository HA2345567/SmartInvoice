<svg width="350" height="100" viewBox="0 0 350 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text-smart {
      font-family: 'Outfit', 'Plus Jakarta Sans', 'Syne', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      font-size: 42px;
    }
    .text-invoice {
      font-family: 'Outfit', 'Plus Jakarta Sans', 'Syne', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      fill: #1ed760;
      font-size: 42px;
    }
  </style>
  
  <!-- Logo Mark (Yin-Yang wave) -->
  <g transform="translate(10, 10)">
    <!-- Top Wing -->
    <path d="M 10 38.5 L 48 38.5 C 35 38.5, 35 16, 50 16 C 30 16, 20 38.5, 10 38.5 Z" fill="#ffffff" />
    <!-- Bottom Wing -->
    <path d="M 90 41.5 L 52 41.5 C 65 41.5, 65 64, 50 64 C 70 64, 80 41.5, 90 41.5 Z" fill="#ffffff" />
    <!-- Top-Right thin arc -->
    <path d="M 50 16 A 24 24 0 0 1 74 40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Bottom-Left thin arc -->
    <path d="M 50 64 A 24 24 0 0 1 26 40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wordmark Text -->
  <text x="120" y="62" class="text-smart">Smart<tspan class="text-invoice">Invoice</tspan></text>
</svg>
