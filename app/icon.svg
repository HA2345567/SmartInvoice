<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Contrast background ensuring visibility on both dark and light browser tabs -->
  <circle cx="50" cy="50" r="48" fill="#09090b" stroke="#27272a" stroke-width="2.5" />

  <!-- SmartInvoice Exact Yin-Yang Wing Logo Mark -->
  <!-- Top Wing -->
  <path
    d="M 10 48.5 L 48 48.5 C 35 48.5, 35 26, 50 26 C 30 26, 20 48.5, 10 48.5 Z"
    fill="#ffffff"
  />
  <!-- Bottom Wing -->
  <path
    d="M 90 51.5 L 52 51.5 C 65 51.5, 65 74, 50 74 C 70 74, 80 51.5, 90 51.5 Z"
    fill="#ffffff"
  />
  <!-- Top-Right Thin Arc -->
  <path
    d="M 50 26 A 24 24 0 0 1 74 50"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Bottom-Left Thin Arc -->
  <path
    d="M 50 74 A 24 24 0 0 1 26 50"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
</svg>
